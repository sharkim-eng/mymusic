name: Resolve YouTube Music IDs

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "public/music-data.js"
      - "extra-music.js"
      - "catalog-pack.js"
      - "artist-pack.js"
      - "mega-catalog.js"
      - "tools/export-catalog.mjs"
      - "tools/resolve-ytmusic-ids.py"
      - ".github/workflows/resolve-ytmusic-ids.yml"

permissions:
  contents: write

concurrency:
  group: "resolve-ytmusic-ids"
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export full SHARK catalog
        run: node tools/export-catalog.mjs

      - name: Install YouTube Music resolver
        run: python -m pip install --disable-pip-version-check ytmusicapi

      - name: Resolve audio IDs first, video IDs second
        run: python tools/resolve-ytmusic-ids.py

      - name: Show resolution stats
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cache=json.loads(Path('ytmusic-id-cache.json').read_text('utf-8'))
          counts={}
          for value in cache.values():
              k=value.get('kind','unresolved')
              counts[k]=counts.get(k,0)+1
          print(counts)
          PY

      - name: Commit generated IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add direct-ids-generated.js ytmusic-id-cache.json
          if git diff --cached --quiet; then
            echo "No ID changes to commit."
          else
            git commit -m "Update YouTube Music IDs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
