<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#031118"><title>SHARK - My Music</title><link rel="stylesheet" href="./shark.css"><link rel="stylesheet" href="./enhancements.css">
</head>
<body>
<main class="page">
  <header class="top"><button class="back" id="backButton" aria-label="뒤로 가기">←</button><div class="logo">SHARK</div><div class="logo-dot"></div></header>
  <section class="playlist-head"><h1 class="playlist-title">MY MUSIC</h1><p class="playlist-subtitle" id="playlistSubtitle">내가 좋아하는 노래만 모아봤어.</p></section>
  <section class="library-tabs"><div class="genre-row"><button class="genre-button active" data-view="saved">♥ 저장한 곡</button><button class="genre-button" data-view="recent">최근 들은 곡</button></div></section>
  <button class="play-all-button" id="playAll" hidden>♫ 첫 곡 듣기</button>
  <div class="music-list" id="musicList"></div>
  <a class="text-link" href="./mood.html">다시 기분 고르기</a>
</main>
<script src="./shark-core.js"></script>
<script>
const list=document.getElementById('musicList'),playAll=document.getElementById('playAll'),subtitle=document.getElementById('playlistSubtitle');let view='saved',current=[];
function openSong(song){SHARK.open(song,song.mood||'',song.genre||'')}
function source(){return view==='saved'?SHARK.loadSaved():SHARK.loadRecent()}
function render(){
  current=source();list.innerHTML='';playAll.hidden=!current.length;
  subtitle.textContent=view==='saved'?`좋아하는 노래 ${current.length}곡을 모아봤어.`:`최근 들은 노래 ${current.length}곡이야.`;
  if(!current.length){list.innerHTML=`<div class="empty-message"><div style="font-size:40px;color:#6ce8ee;margin-bottom:12px">${view==='saved'?'♡':'♫'}</div>${view==='saved'?'아직 저장한 노래가 없어.<br>마음에 드는 노래에 ♥를 눌러 저장해봐.':'아직 들은 노래가 없어.<br>추천곡을 재생하면 여기에 기록돼.'}</div>`;return}
  current.forEach(song=>{
    const card=document.createElement('article');card.className='music-item';const saved=SHARK.isSaved(song);
    card.innerHTML=`<div class="music-info"><h2>${song.title}</h2><p>${song.artist}</p>${view==='recent'&&song.mood?`<span class="history-meta">${SHARK.emoji[song.mood]||''} ${song.mood}${song.genre?` · ${song.genre}`:''}</span>`:''}</div><div class="music-actions"><button class="play-button">♫ YouTube Music</button><button class="heart-button ${saved?'saved':''}">${saved?'♥':'♡'}</button></div>`;
    card.querySelector('.play-button').onclick=()=>openSong(song);
    card.querySelector('.heart-button').onclick=()=>{SHARK.toggleSaved(song);render()};
    list.appendChild(card)
  });
  playAll.onclick=()=>openSong(current[0])
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});
document.getElementById('backButton').onclick=()=>history.length>1?history.back():location.href='./mood.html';render();
</script>
</body>
</html>
