<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#031118"><title>SHARK - My Music</title><link rel="stylesheet" href="./shark.css">
</head>
<body>
<main class="page">
  <header class="top"><button class="back" id="backButton" aria-label="뒤로 가기">←</button><div class="logo">SHARK</div><div class="logo-dot"></div></header>
  <section class="playlist-head"><h1 class="playlist-title">MY MUSIC</h1><p class="playlist-subtitle">내가 좋아하는 노래만 모아봤어.</p></section>
  <button class="play-all-button" id="playAll" hidden>♫ YouTube Music에서 첫 곡 듣기</button>
  <div class="music-list" id="musicList"></div>
  <a class="text-link" href="./mood.html">다시 기분 고르기</a>
</main>
<script src="./shark-core.js"></script>
<script>
const list=document.getElementById('musicList'),playAll=document.getElementById('playAll');
function openSong(song){const u=SHARK.url(song)||song.url;if(u)location.href=u}
function render(){const saved=SHARK.loadSaved();list.innerHTML='';playAll.hidden=!saved.length;if(!saved.length){list.innerHTML='<div class="empty-message"><div style="font-size:40px;color:#6ce8ee;margin-bottom:12px">♡</div>아직 저장한 노래가 없어.<br>마음에 드는 노래에 ♥를 눌러 저장해봐.</div>';return}saved.forEach(song=>{const card=document.createElement('article');card.className='music-item';card.innerHTML=`<div class="music-info"><h2>${song.title}</h2><p>${song.artist}</p></div><div class="music-actions"><button class="play-button">♫ YouTube Music에서 재생</button><button class="remove-button">♥</button></div>`;card.querySelector('.play-button').onclick=()=>openSong(song);card.querySelector('.remove-button').onclick=()=>{SHARK.toggleSaved(song);render()};list.appendChild(card)});playAll.onclick=()=>openSong(saved[0])}
document.getElementById('backButton').onclick=()=>history.length>1?history.back():location.href='./mood.html';render();
</script>
</body>
</html>
