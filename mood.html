<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#031118"><title>SHARK - Mood</title><link rel="stylesheet" href="./shark.css">
</head>
<body>
<main class="page">
  <header class="top"><button class="back" id="backButton" aria-label="뒤로 가기">←</button><div class="logo">SHARK</div><div class="logo-dot"></div></header>
  <section class="intro"><h1 class="intro-title">지금 기분은<br><span>어떤 쪽이야?</span></h1><p class="subtitle">가장 가까운 감정 하나만 골라줘.</p></section>
  <div class="mood-grid" id="moodGrid"></div>
  <div class="recommend-wrap"><button class="recommend-button" id="recommendButton"><span>이 기분으로 음악 찾기</span><span class="arrow">→</span></button></div>
</main>
<script>
const moods=[['행복','😊','밝고 기분 좋은 순간'],['사랑','💗','설레고 따뜻한 마음'],['슬픔','😢','혼자 있고 싶은 밤'],['화남','😡','답답함을 날리고 싶을 때'],['피곤','😴','힘을 빼고 쉬고 싶은 날'],['위로','🥺','조용히 기대고 싶은 순간'],['신남','🤩','에너지가 필요한 지금'],['SHARK','🦈','바다 · 새벽 · 드라이브']];
let selected='';const grid=document.getElementById('moodGrid'),go=document.getElementById('recommendButton');
for(const [name,emoji,desc] of moods){const b=document.createElement('button');b.className='mood-button';b.innerHTML=`<span class="emoji">${emoji}</span><span class="mood-copy"><span class="mood-name">${name}</span><span class="mood-description">${desc}</span></span>`;b.onclick=()=>{selected=name;document.querySelectorAll('.mood-button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');go.classList.add('visible')};grid.appendChild(b)}
go.onclick=()=>{if(selected)location.href=`./result.html?mood=${encodeURIComponent(selected)}`};document.getElementById('backButton').onclick=()=>location.href='./index.html';
</script>
</body>
</html>
